[package]
name = "bet-oracle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.5.0"

[dev-dependencies]

[profile.release]
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
